#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]


[project.urls]
Repository = "https://github.com/petmycat/ComfyUI-gen2"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/petmycat/ComfyUI-gen2/wiki"
"Bug Tracker" = "https://github.com/petmycat/ComfyUI-gen2/issues"

[tool.comfy]
PublisherId = "petmycat"
DisplayName = "ComfyUI-gen2"
